name: QEMU boot tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  boot-test:
    needs: build-debs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: selection-policy
            run: ci/selection-policy/run.sh
            out: ci/out/selection-policy
          - name: mok-chain
            run: ci/mok-chain/run.sh
            out: ci/out/mok-chain
          - name: bios-trial
            run: ci/bios-trial/run.sh
            out: ci/out/bios-trial
          - name: recovery-smoke
            run: recovery/build.sh && recovery/tests/qemu-smoke.sh
            out: recovery/out/smoke
          - name: uefi-bless
            run: ci/integration/uefi-bless/run.sh
            out: ci/out/integration/uefi-bless
          - name: bios-bless
            run: recovery/build.sh && ci/integration/bios-bless/run.sh
            out: ci/out/integration/bios-bless
          - name: lifecycle-uefi
            run: recovery/build.sh && ci/lifecycle/packages/run.sh uefi
            out: ci/out/lifecycle/packages/uefi
          - name: lifecycle-bios
            run: recovery/build.sh && ci/lifecycle/packages/run.sh bios
            out: ci/out/lifecycle/packages/bios
          - name: fallback-uefi
            run: recovery/build.sh && ci/recovery-fallback/run.sh uefi
            out: ci/out/recovery-fallback/uefi
          - name: fallback-bios
            run: recovery/build.sh && ci/recovery-fallback/run.sh bios
            out: ci/out/recovery-fallback/bios
          - name: publish-uefi
            run: recovery/build.sh && ci/publish/run.sh uefi
            out: ci/out/publish/uefi
          - name: publish-bios
            run: recovery/build.sh && ci/publish/run.sh bios
            out: ci/out/publish/bios
          - name: candidate-uefi
            run: recovery/build.sh && ci/candidate-fallback/run.sh uefi
            out: ci/out/candidate-fallback/uefi
          - name: candidate-bios
            run: recovery/build.sh && ci/candidate-fallback/run.sh bios
            out: ci/out/candidate-fallback/bios
          - name: interrupt-uefi
            run: recovery/build.sh && ci/publish-interrupt/run.sh uefi
            out: ci/out/publish-interrupt/uefi
          - name: interrupt-bios
            run: recovery/build.sh && ci/publish-interrupt/run.sh bios
            out: ci/out/publish-interrupt/bios
          - name: graphics-uefi
            run: recovery/build.sh && ci/graphics/run.sh uefi
            out: ci/out/graphics/uefi
          - name: graphics-bios
            run: recovery/build.sh && ci/graphics/run.sh bios
            out: ci/out/graphics/bios
          - name: install
            run: ci/install/run.sh
            out: ci/out/install
          - name: secure-boot-uefi
            run: recovery/build.sh && ci/secure-boot/run.sh uefi
            out: ci/out/secure-boot/uefi

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the vintner packages
        uses: actions/download-artifact@v4
        with:
          name: vintner-debs
          path: ci/out/vintner-debs

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf mtools fdisk e2fsprogs kmod cpio xz-utils \
            python3-pefile python3-virt-firmware sbsigntool cloud-image-utils binutils systemd-boot-efi systemd-ukify \
            debootstrap debian-archive-keyring dosfstools

      - name: Set up Go
        if: matrix.name == 'uefi-bless' || matrix.name == 'bios-bless' || matrix.name == 'lifecycle-uefi' || matrix.name == 'lifecycle-bios' || matrix.name == 'fallback-uefi' || matrix.name == 'fallback-bios' || matrix.name == 'publish-uefi' || matrix.name == 'publish-bios' || matrix.name == 'candidate-uefi' || matrix.name == 'candidate-bios' || matrix.name == 'interrupt-uefi' || matrix.name == 'interrupt-bios' || matrix.name == 'graphics-uefi' || matrix.name == 'graphics-bios' || matrix.name == 'secure-boot-uefi'
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      - name: Cache Debian image
        if: matrix.name == 'uefi-bless' || matrix.name == 'bios-bless' || matrix.name == 'lifecycle-uefi' || matrix.name == 'lifecycle-bios' || matrix.name == 'fallback-uefi' || matrix.name == 'fallback-bios' || matrix.name == 'publish-uefi' || matrix.name == 'publish-bios' || matrix.name == 'candidate-uefi' || matrix.name == 'candidate-bios' || matrix.name == 'interrupt-uefi' || matrix.name == 'interrupt-bios' || matrix.name == 'graphics-uefi' || matrix.name == 'graphics-bios' || matrix.name == 'secure-boot-uefi'
        uses: actions/cache@v6
        with:
          path: ci/out/cache/debian-13-genericcloud-amd64-20261001-2618.qcow2
          key: debian-13-genericcloud-amd64-20261001-2618

      - name: Enable KVM for GitHub-hosted runners
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ${{ matrix.name }}
        env:
          VINTNER_DEBS: ${{ github.workspace }}/ci/out/vintner-debs
        run: ${{ matrix.run }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.out }}/*.log
            ${{ matrix.out }}/*.tsv
            ${{ matrix.out }}/*.txt
            ${{ matrix.out }}/*.ppm
          retention-days: 7

  build-debs:
    # The rows install vintner from these packages (WO-0010 2.5). Trixie, because the package
    # builds with Go 1.24 (ubuntu-24.04 ships 1.22); lint.yml builds and lints the same packages.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper dpkg-dev golang-go curl xz-utils cpio kmod binutils grub-pc-bin systemd-boot-efi
      - uses: actions/checkout@v7
      - name: Build binary packages
        run: dpkg-buildpackage -us -uc -b
      - name: Keep the packages
        run: mkdir -p vintner-debs && cp ../*.deb vintner-debs/
      - uses: actions/upload-artifact@v4
        with:
          name: vintner-debs
          path: vintner-debs/*.deb
          retention-days: 3
