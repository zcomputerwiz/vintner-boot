name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every tracked shell script
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper dpkg-dev lintian
      - name: Build binary packages
        run: dpkg-buildpackage -us -uc -b
      - name: lintian
        run: lintian --fail-on error ../*.changes
