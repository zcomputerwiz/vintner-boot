name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck every tracked shell script
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: No generated output, private keys or firmware stores in git
        run: "! git ls-files | grep -E '(^|/)ci/out/|[.]key$|[.]fd$'"

  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev lintian
      - name: Build binary packages
        run: dpkg-buildpackage -us -uc -b
      - name: lintian
        run: lintian --fail-on error ../*.changes

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Static build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/vintner
