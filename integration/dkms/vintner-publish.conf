# Installed by vintner-core. After every DKMS install, removal, unbuild or uninstall
# vintner publishes an image that records the new module tree, so that a rebuilt
# module gets a counted trial boot and the image that predates it is not left as the
# only choice (WO-0010 5.3). The kernel version is passed as an argument: DKMS
# expands $kernelver when it runs the command.
post_transaction='/usr/lib/vintner/dkms-post-transaction "$kernelver"'
