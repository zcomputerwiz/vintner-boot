# vintner-boot static GRUB configuration for BIOS machines.
# Interface: firmware/bios/INTERFACE.md. Architecture §4 (BIOS, health and
# blessing) and ADR-0003 option B (re-arm). This file is never regenerated:
# the publisher only writes slot directories and grubenv variables.

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

# vintner_boot DIR: boots /vintner/bios/DIR. Returns only if loading fails.
function vintner_boot {
	unset vintner_cmdline
	echo "vintner: trying $1"
	if source /vintner/bios/$1/slot.cfg; then
		if linux /vintner/bios/$1/vmlinuz $vintner_cmdline; then
			if initrd /vintner/bios/$1/initrd.img; then
				boot
			fi
		fi
	fi
	echo "vintner: cannot boot $1"
}

# vintner_count VAR ID: takes one try off counter VAR ("xxx" is three tries
# left, "0" is bad) and saves it together with VINTNER_BOOTED=ID in one
# save_env. Fails without writing if VAR is bad, unset or malformed. Sets
# vintner_nosave if save_env fails, because nothing can be counted then.
function vintner_count {
	eval "set vintner_t=\"\$$1\""
	if regexp --set=1:vintner_t '^x(x*)$' "$vintner_t"; then
		if [ -z "$vintner_t" ]; then set vintner_t=0; fi
		set $1=$vintner_t
		set VINTNER_BOOTED=$2
		if save_env $1 VINTNER_BOOTED; then return 0; fi
		set vintner_nosave=1
	fi
	return 1
}

# vintner_pick ID DIR VAR: a menu choice. Counts like an automatic boot and
# also boots an image that is already bad, as systemd-boot does on UEFI.
function vintner_pick {
	if vintner_count $3 $1; then true; else
		set VINTNER_BOOTED=$1
		save_env VINTNER_BOOTED
	fi
	vintner_boot $2
}

set vintner_env=
set vintner_nosave=
set vintner_ra=
if load_env; then
	if [ -n "$VINTNER_ORDER" ]; then set vintner_env=1; fi
fi

if keystatus --shift; then
	set timeout=-1
	if [ -n "$vintner_env" ]; then
		for g in $VINTNER_ORDER; do
			if regexp '^[0-9]+$' "$g"; then
				menuentry "vintner os $g" "$g" { vintner_pick $2 os-$2 VINTNER_T_$2 }
			fi
		done
	fi
	menuentry "vintner recovery A" { vintner_pick RA recovery-a VINTNER_T_RA }
	menuentry "vintner recovery B" { vintner_boot recovery-b }
else
	if [ -n "$vintner_env" ]; then
		for g in $VINTNER_ORDER; do
			if regexp '^[0-9]+$' "$g"; then
				if [ -z "$vintner_nosave" ]; then
					if vintner_count VINTNER_T_$g $g; then vintner_boot os-$g; fi
				fi
			fi
		done
		if [ -z "$vintner_nosave" ]; then
			set vintner_ra=counted
			if vintner_count VINTNER_T_RA RA; then vintner_boot recovery-a; fi
			if [ -n "$vintner_nosave" ]; then set vintner_ra=; fi
		fi
	fi
	# No usable grubenv, or save_env failed: recovery A without writing anything.
	if [ -z "$vintner_ra" ]; then vintner_boot recovery-a; fi
	vintner_boot recovery-b
	echo "vintner: no bootable image"
fi
