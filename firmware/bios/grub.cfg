# vintner-boot static GRUB configuration for BIOS machines.
# Interface: firmware/bios/INTERFACE.md. Architecture §4 (BIOS, health and
# blessing) and ADR-0003 option B (re-arm). This file is never regenerated:
# the publisher only writes slot directories and grubenv variables.

# Serial console, when the machine has a serial port: GRUB's output and keys then
# also go there. Without one, "serial" fails and prints a line, and the two
# terminal commands would print more; so they only run after "serial" worked,
# and the screen is cleared at once, so a machine with no serial port shows
# nothing (R10, WO-0010 1.4).
if serial --unit=0 --speed=115200; then
	terminal_input serial console
	terminal_output serial console
else
	clear
fi
insmod all_video
set gfxmode=auto
set gfxpayload=keep

# vintner_boot DIR: boots /vintner/bios/DIR. Returns only if loading fails.
function vintner_boot {
	unset vintner_cmdline
	echo "vintner: trying $1"
	if source /vintner/bios/$1/slot.cfg; then
		if linux /vintner/bios/$1/vmlinuz $vintner_cmdline; then
			if initrd /vintner/bios/$1/initrd.img; then
				boot
			fi
		fi
	fi
	echo "vintner: cannot boot $1"
}

# vintner_variant_boot DIR ID: boots variant ID of /vintner/bios/DIR, the
# image's command line with the product's extra tokens (slot.cfg, WO-0010 4.3).
# It counts nothing and writes nothing: no counter, no VINTNER_BOOTED (D-D).
# Returns only if loading fails.
function vintner_variant_boot {
	unset vintner_cmdline
	unset vintner_vc
	echo "vintner: trying $1 variant $2"
	if source /vintner/bios/$1/slot.cfg; then
		eval "set vintner_vc=\"\$vintner_vcmdline_$2\""
		if [ -n "$vintner_vc" ]; then
			if linux /vintner/bios/$1/vmlinuz $vintner_vc; then
				if initrd /vintner/bios/$1/initrd.img; then
					boot
				fi
			fi
		fi
	fi
	echo "vintner: cannot boot $1 variant $2"
}

# vintner_count VAR ID: takes one try off counter VAR ("xxx" is three tries
# left, "0" is bad) and saves it together with VINTNER_BOOTED=ID in one
# save_env. Fails without writing if VAR is bad, unset or malformed. Sets
# vintner_nosave if save_env fails, because nothing can be counted then.
function vintner_count {
	eval "set vintner_t=\"\$$1\""
	if regexp --set=1:vintner_t '^x(x*)$' "$vintner_t"; then
		if [ -z "$vintner_t" ]; then set vintner_t=0; fi
		set $1=$vintner_t
		set VINTNER_BOOTED=$2
		if save_env $1 VINTNER_BOOTED VINTNER_NEXT; then return 0; fi
		set vintner_nosave=1
	fi
	return 1
}

# vintner_pick ID DIR VAR: a menu choice. Counts like an automatic boot and
# also boots an image that is already bad, as systemd-boot does on UEFI.
function vintner_pick {
	if vintner_count $3 $1; then true; else
		set VINTNER_BOOTED=$1
		save_env VINTNER_BOOTED VINTNER_NEXT
	fi
	vintner_boot $2
}

# vintner_oneshot VALUE: the next-boot request that "vintner next-boot" left in
# VINTNER_NEXT (WO-0010 4.4). The variable is already unset here, and every path
# below clears it from grubenv: a counter write does it in the same save_env, the
# others save it alone first. Returns only if the target could not boot, and
# then the automatic order goes on. If grubenv cannot be written, the request is
# not honoured: it could not be cleared and would repeat on every boot.
function vintner_oneshot {
	if [ "$1" = recovery ]; then
		# Recovery A while it is not bad, then recovery B, as on UEFI.
		if vintner_count VINTNER_T_RA RA; then vintner_boot recovery-a; fi
		if [ -z "$vintner_nosave" ]; then
			if save_env VINTNER_NEXT; then vintner_boot recovery-b; fi
		fi
	elif regexp '^[0-9]+$' "$1"; then
		# A chosen generation counts like any boot, and boots even if it is bad.
		if vintner_count VINTNER_T_$1 $1; then
			vintner_boot os-$1
		elif [ -z "$vintner_nosave" ]; then
			set VINTNER_BOOTED=$1
			if save_env VINTNER_BOOTED VINTNER_NEXT; then vintner_boot os-$1; fi
		fi
	elif regexp '^[0-9]+:[a-z][a-z0-9_]*$' "$1"; then
		# A variant of a generation counts nothing (D-D).
		regexp --set=1:vintner_og '^([0-9]+):' "$1"
		regexp --set=1:vintner_ov ':(.*)$' "$1"
		if save_env VINTNER_NEXT; then vintner_variant_boot os-$vintner_og $vintner_ov; fi
	else
		# Not a form this file knows: drop it.
		save_env VINTNER_NEXT
	fi
}

set vintner_env=
set vintner_nosave=
set vintner_ra=
set vintner_next=
set vintner_menu=
if load_env; then
	if [ -n "$VINTNER_ORDER" ]; then set vintner_env=1; fi
	set vintner_next="$VINTNER_NEXT"
	unset VINTNER_NEXT
fi

if keystatus --shift; then
	set vintner_menu=1
	set timeout=-1
	# A request that is pending is used up by this boot.
	if [ -n "$vintner_next" ]; then save_env VINTNER_NEXT; fi
elif [ -n "$vintner_next" ]; then
	if regexp --set=1:vintner_mt '^menu:([0-9]+)$' "$vintner_next"; then
		# The menu once, for that many seconds; then the first entry boots.
		if save_env VINTNER_NEXT; then
			set vintner_menu=1
			set timeout=$vintner_mt
		fi
	elif [ -n "$vintner_env" ]; then
		vintner_oneshot "$vintner_next"
	fi
fi

if [ -n "$vintner_menu" ]; then
	if [ -n "$vintner_env" ]; then
		for g in $VINTNER_ORDER; do
			if regexp '^[0-9]+$' "$g"; then
				# The slot's title and variants come from its slot.cfg. A slot published
				# before the title existed has none: "Generation <g>".
				unset vintner_title
				unset vintner_variants
				source /vintner/bios/os-$g/slot.cfg
				set vintner_gt="$vintner_title"
				if [ -z "$vintner_gt" ]; then set vintner_gt="Generation $g"; fi
				menuentry "$vintner_gt" "$g" { vintner_pick $2 os-$2 VINTNER_T_$2 }
				# The generation's variants, directly after it.
				for v in $vintner_variants; do
					if regexp '^[a-z][a-z0-9_]*$' "$v"; then
						eval "set vintner_vt=\"\$vintner_vtitle_$v\""
						menuentry "$vintner_vt" "$g" "$v" { vintner_variant_boot os-$2 $3 }
					fi
				done
			fi
		done
	fi
	unset vintner_title
	source /vintner/bios/recovery-a/slot.cfg
	set vintner_rt="$vintner_title"
	if [ -z "$vintner_rt" ]; then set vintner_rt="Recovery Console"; fi
	menuentry "$vintner_rt" { vintner_pick RA recovery-a VINTNER_T_RA }
	unset vintner_title
	source /vintner/bios/recovery-b/slot.cfg
	set vintner_rt="$vintner_title"
	if [ -z "$vintner_rt" ]; then set vintner_rt="Recovery Console (backup)"; fi
	menuentry "$vintner_rt" { vintner_boot recovery-b }
else
	if [ -n "$vintner_env" ]; then
		for g in $VINTNER_ORDER; do
			if regexp '^[0-9]+$' "$g"; then
				if [ -z "$vintner_nosave" ]; then
					if vintner_count VINTNER_T_$g $g; then vintner_boot os-$g; fi
				fi
			fi
		done
		if [ -z "$vintner_nosave" ]; then
			set vintner_ra=counted
			if vintner_count VINTNER_T_RA RA; then vintner_boot recovery-a; fi
			if [ -n "$vintner_nosave" ]; then set vintner_ra=; fi
		fi
	fi
	# No usable grubenv, or save_env failed: recovery A without writing anything.
	if [ -z "$vintner_ra" ]; then vintner_boot recovery-a; fi
	vintner_boot recovery-b
	echo "vintner: no bootable image"
fi
