# systemd-boot configuration deployed to \loader\loader.conf on the ESP.
# Selection policy: docs/architecture.md section 4.1 and docs/adr/0003.
#
# First non-bad vintner entry in sort order: newest ordinary image,
# then recovery A, then recovery B.
default vintner-*
# Boot without a menu; a key press at startup still opens it.
# Never "menu-disabled", which also blocks the key-press menu.
timeout 0
editor no
auto-entries no
